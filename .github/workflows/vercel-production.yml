# Safety net for caagency.com production deploys.
#
# During GitHub's 2026-07-16 "Partially Degraded Service" incident, webhook
# deliveries to Vercel were silently dropped: pushes to master produced no
# production deployment, and nobody noticed until a release didn't ship.
#
# In September 2026 a second failure mode appeared: the Git integration built
# a READY production deployment, but Vercel never attached the production
# domains to it (the "Vercel" commit status stayed on "Waiting for checks to
# complete"), so caagency.com kept serving the previous release.
#
# This workflow makes both failure modes loud and self-healing. Once CI's Build
# check passes for the pushed commit it:
#   1. finds the commit's production deployment, deploying via the Vercel CLI
#      only if the Git integration never created one (the CLI uploads the exact
#      checked-out commit and cannot mis-resolve a ref; an earlier deploy-hook
#      variant was removed after hooks resolved to a stale wrong commit);
#   2. waits for that deployment to be READY;
#   3. gives Vercel's own domain assignment a short grace period, then promotes
#      the deployment itself if caagency.com still points elsewhere, and fails
#      unless the domain ends up on the pushed commit.
# A run for a commit that is no longer the head of master does nothing.
#
# VERCEL_TOKEN is a repo secret scoped to the ca-agency-website project.
# Keep it current when its expiry approaches; revoking it stops this safety
# net, not Vercel's native Git integration.
name: Vercel production deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    concurrency:
      group: vercel-production-ca-agency-website
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_eHASIJyn6BlOAPPOQZLUi5NI
      VERCEL_PROJECT_ID: prj_4aserprsHCvXVLUV9l6bGtZCpql7
      PRODUCTION_DOMAIN: caagency.com
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Make sure caagency.com serves this push
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set"
            exit 1
          fi

          vercel_api() {
            curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" "$@"
          }

          still_master_head() {
            local master
            master=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha)
            [ "$master" = "$GITHUB_SHA" ]
          }

          production_deployment_id() {
            vercel_api "https://api.vercel.com/v7/deployments?teamId=${VERCEL_ORG_ID}&projectId=${VERCEL_PROJECT_ID}&sha=${GITHUB_SHA}&target=production&limit=20" \
              | jq -r --arg sha "$GITHUB_SHA" \
                  '[.deployments[] | select(.target == "production" and .meta.githubCommitSha == $sha)] | sort_by(.created) | last | (.uid // .id // empty)'
          }

          ready_state() {
            vercel_api "https://api.vercel.com/v13/deployments/$1?teamId=${VERCEL_ORG_ID}" | jq -r .readyState
          }

          domain_deployment_id() {
            vercel_api "https://api.vercel.com/v4/aliases/${PRODUCTION_DOMAIN}?teamId=${VERCEL_ORG_ID}" | jq -r '.deploymentId // empty'
          }

          # Give the native GitHub integration time to register the push.
          sleep 90

          # Never ship an old queued push or a commit whose CI has not passed.
          # Build depends on lint and tests.
          for attempt in {1..30}; do
            if ! still_master_head; then
              echo "A newer master commit exists; skipping this stale run."
              exit 0
            fi
            build=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=Build" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // "pending"')
            case "$build" in
              success) break ;;
              failure|cancelled|timed_out|action_required)
                echo "::error::CI Build check ended with ${build}; refusing to ship ${GITHUB_SHA}."
                exit 1 ;;
            esac
            if [ "$attempt" -eq 30 ]; then
              echo "::error::CI Build check did not pass within 10 minutes."
              exit 1
            fi
            sleep 20
          done

          deployment=$(production_deployment_id)
          if [ -z "$deployment" ]; then
            if ! still_master_head; then
              echo "A newer master commit exists; skipping this stale run."
              exit 0
            fi
            echo "::warning::No native production deployment for ${GITHUB_SHA} after CI passed — deploying via CLI."
            url=$(npx vercel@50.25.4 deploy --prod --yes --token="$VERCEL_TOKEN")
            deployment=$(vercel_api "https://api.vercel.com/v13/deployments/${url#https://}?teamId=${VERCEL_ORG_ID}" | jq -r .id)
          fi
          echo "Production deployment for ${GITHUB_SHA}: ${deployment}"

          for attempt in {1..60}; do
            state=$(ready_state "$deployment")
            case "$state" in
              READY) break ;;
              ERROR|CANCELED)
                echo "::error::Deployment ${deployment} ended in ${state}."
                exit 1 ;;
            esac
            if [ "$attempt" -eq 60 ]; then
              echo "::error::Deployment ${deployment} was not READY within 10 minutes (state: ${state})."
              exit 1
            fi
            sleep 10
          done

          # Vercel normally attaches the production domains on its own shortly
          # after the build is READY and its deployment checks pass.
          for attempt in {1..12}; do
            if [ "$(domain_deployment_id)" = "$deployment" ]; then
              echo "${PRODUCTION_DOMAIN} is serving ${deployment}; nothing to do."
              exit 0
            fi
            sleep 10
          done

          if ! still_master_head; then
            echo "A newer master commit exists; leaving promotion to its run."
            exit 0
          fi

          echo "::warning::${PRODUCTION_DOMAIN} still points at $(domain_deployment_id); promoting ${deployment}."
          vercel_api -X POST "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/promote/${deployment}?teamId=${VERCEL_ORG_ID}" >/dev/null

          for attempt in {1..18}; do
            if [ "$(domain_deployment_id)" = "$deployment" ]; then
              echo "Promoted: ${PRODUCTION_DOMAIN} is serving ${deployment}."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Promotion requested, but ${PRODUCTION_DOMAIN} still points at $(domain_deployment_id) instead of ${deployment}."
          exit 1
